<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gmai Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <style>
    /* Inside the Admin Hub the hub provides the menu and sign-out. */
    body.embed .side, body.embed .top .menu, body.embed #logoutBtn, body.embed .who { display: none !important; }
    body.embed .shell { grid-template-columns: 1fr !important; display: block; }
    body.embed .top { display: none; }
    body.embed .page { padding-top: 16px; }
  </style>
</head>
<body>
  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <div class="brand big"><span class="logo">✉</span> Gmai <small>Admin</small></div>
      <label>Username<input name="username" value="admin" autocomplete="username" /></label>
      <label>Password<input name="password" type="password" placeholder="admin123" autocomplete="current-password" /></label>
      <button class="btn primary full">Sign in</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="side" id="side">
      <div class="brand"><span class="logo">✉</span> Gmai <small>Admin</small></div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <header class="top">
        <button class="icon-btn menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <span class="who" id="who"></span>
        <button class="btn ghost" id="logoutBtn">Sign out</button>
      </header>
      <section id="page" class="page"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="admin.js"></script>
  <script src="pages.js"></script>
</body>
</html>
